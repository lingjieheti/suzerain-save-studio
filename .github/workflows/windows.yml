name: Windows build and tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Locate the compiler for PowerShell
        shell: msys2 {0}
        run: |
          compiler_dir="$(cygpath -w /ucrt64/bin)"
          echo "SUZERAIN_MINGW=$compiler_dir" >> "$GITHUB_ENV"
          echo "$compiler_dir" >> "$GITHUB_PATH"
      - name: Build the portable editor
        shell: pwsh
        run: ./build.ps1 -CompilerKind GCC -Toolchain $env:SUZERAIN_MINGW
      - name: Run synthetic tests
        shell: pwsh
        run: ./test.ps1 -Compiler (Join-Path $env:SUZERAIN_MINGW 'g++.exe')
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.x'
      - name: Verify live state changes with simulated campaigns
        shell: pwsh
        run: dotnet run --project tests/live/LiveChecks.csproj -c Release
      - name: Verify live panel controls and compact layouts
        shell: pwsh
        run: dotnet run --project tests/panel/PanelChecks.csproj -c Release
      - name: Verify read-only choice previews
        shell: pwsh
        run: dotnet run --project tests/choices/ChoiceChecks.csproj -c Release
      - name: Verify hover behavior and tooltip layout
        shell: pwsh
        run: dotnet run --project tests/hover/HoverChecks.csproj -c Release
