name: Windows build and tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build the portable editor
        shell: msys2 {0}
        run: pwsh.exe -NoProfile -File build.ps1 -CompilerKind GCC -Toolchain "$(cygpath -w /ucrt64/bin)"
      - name: Run synthetic tests
        shell: msys2 {0}
        run: pwsh.exe -NoProfile -File test.ps1 -Compiler "$(cygpath -w /ucrt64/bin/g++.exe)"
