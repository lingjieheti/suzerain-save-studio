name: Windows build and tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Locate the compiler for PowerShell
        shell: msys2 {0}
        run: |
          compiler_dir="$(cygpath -w /ucrt64/bin)"
          echo "SUZERAIN_MINGW=$compiler_dir" >> "$GITHUB_ENV"
          echo "$compiler_dir" >> "$GITHUB_PATH"
      - name: Build the portable editor
        shell: pwsh
        run: ./build.ps1 -CompilerKind GCC -Toolchain $env:SUZERAIN_MINGW
      - name: Run synthetic tests
        shell: pwsh
        run: ./test.ps1 -Compiler (Join-Path $env:SUZERAIN_MINGW 'g++.exe')
